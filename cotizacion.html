<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cotización EDS</title><style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f3f4f6;color:#17202a}.wrap{max-width:900px;margin:auto;padding:14px}.card{background:#fff;border-radius:14px;padding:18px;margin:10px 0;box-shadow:0 2px 10px #0001}.brand{display:flex;gap:12px;align-items:center;border-bottom:2px solid #111827;padding-bottom:12px}.logo{width:65px;height:65px;border:1px solid #ccc;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#666}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-weight:bold;font-size:13px;margin:8px 0 5px}input,textarea{width:100%;padding:10px;border:1px solid #ccd3dd;border-radius:8px;font-size:16px}textarea{min-height:75px}.full{grid-column:1/-1}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{border:1px solid #ccd3dd;padding:6px}th{background:#eef1f5}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:bold;margin:5px 4px 5px 0;cursor:pointer}.primary{background:#111827;color:#fff}.secondary{background:#e5e7eb}.danger{background:#fee2e2}.totals{max-width:330px;margin:15px 0 0 auto}.tr{display:flex;justify-content:space-between;padding:5px}.grand{font-size:19px;font-weight:bold;border-top:2px solid #111827;padding-top:8px}.actions{margin-top:14px}.msg{font-weight:bold;margin:10px 0}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}table{font-size:13px}}@media print{body{background:#fff}.no-print{display:none!important}.wrap{max-width:none;padding:0}.card{box-shadow:none;border-radius:0;margin:0}.brand{margin-bottom:10px}.btn{display:none!important}input,textarea{border:0;padding:0}.actions,.msg{display:none!important}}
</style></head><body><div class="wrap"><div class="card"><div class="brand"><div class="logo">LOGO</div><div><h1 style="margin:0">COTIZACIÓN DE SERVICIO</h1><b>Mantenimiento eléctrico y mecánico de estaciones de servicio</b></div></div><div class="grid"><div><label>N.º de cotización</label><input id="numero"></div><div><label>Fecha</label><input id="fecha" type="date"></div><div><label>Cliente / Empresa</label><input id="cliente"></div><div><label>Estación de servicio</label><input id="estacion"></div><div><label>Dirección</label><input id="direccion"></div><div><label>Contacto</label><input id="contacto"></div><div class="full"><label>Descripción / alcance del trabajo</label><textarea id="descripcion"></textarea></div></div><h3>Materiales y servicios</h3><table id="items"><thead><tr><th>Cant.</th><th>Unidad</th><th>Descripción</th><th>Precio unitario</th><th>Total</th><th class="no-print"></th></tr></thead><tbody></tbody></table><button class="btn secondary no-print" onclick="addItem()">+ Agregar ítem</button><div class="totals"><div class="tr"><span>Subtotal</span><b id="subtotal">$0.00</b></div><div class="tr"><span>IVA (%)</span><input id="iva" type="number" value="15" min="0" step="0.01" oninput="calc()" style="width:90px"></div><div class="tr"><span>IVA</span><b id="ivaval">$0.00</b></div><div class="tr grand"><span>TOTAL</span><b id="total">$0.00</b></div></div><div class="grid"><div class="full"><label>Observaciones / condiciones de pago</label><textarea id="observaciones"></textarea></div></div><div class="actions no-print"><button class="btn primary" onclick="generarPDF()">📄 GENERAR PDF</button><button class="btn secondary" onclick="nueva()">🆕 NUEVA COTIZACIÓN</button></div><div id="msg" class="msg"></div></div></div><script>
const $=id=>document.getElementById(id);function money(n){return '$'+Number(n||0).toFixed(2)}function fecha(){return new Date().toISOString().slice(0,10)}function numero(){let n=+localStorage.getItem('cotNum')||0;n++;localStorage.setItem('cotNum',n);return 'COT-'+String(n).padStart(4,'0')}function addItem(q=1,u='und',d='',p=0){let r=document.createElement('tr');r.innerHTML=`<td><input class="q" type="number" value="${q}" min="0" step="0.01"></td><td><input class="u" value="${u}"></td><td><input class="d" value="${d}"></td><td><input class="p" type="number" value="${p}" min="0" step="0.01"></td><td class="line">$0.00</td><td class="no-print"><button class="btn danger" onclick="this.closest('tr').remove();calc()">×</button></td>`;$('items').querySelector('tbody').appendChild(r);r.querySelectorAll('input').forEach(x=>x.oninput=calc);calc()}function calc(){let s=0;document.querySelectorAll('#items tbody tr').forEach(r=>{let v=(+r.querySelector('.q').value||0)*(+r.querySelector('.p').value||0);s+=v;r.querySelector('.line').textContent=money(v)});let iv=s*(+$('iva').value||0)/100;$('subtotal').textContent=money(s);$('ivaval').textContent=money(iv);$('total').textContent=money(s+iv);return{s,iv,total:s+iv}}function generarPDF(){calc();$('msg').textContent='Preparando documento para guardar como PDF…';setTimeout(()=>{window.print();$('msg').textContent='';},250)}function nueva(){['cliente','estacion','direccion','contacto','descripcion','observaciones'].forEach(id=>$(id).value='');$('numero').value=numero();$('fecha').value=fecha();$('iva').value=15;$('items').querySelector('tbody').innerHTML='';addItem();$('msg').textContent=''}window.onload=nueva;</script></body></html>
