<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cotización EDS</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f3f4f6;color:#17202a}.wrap{max-width:900px;margin:auto;padding:14px}.card{background:#fff;border-radius:14px;padding:18px;margin:10px 0;box-shadow:0 2px 10px #0001}.brand{display:flex;gap:12px;align-items:center;border-bottom:2px solid #111827;padding-bottom:12px}.logo{width:65px;height:65px;border:1px solid #ccc;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#666}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-weight:bold;font-size:13px;margin:8px 0 5px}input,textarea{width:100%;padding:10px;border:1px solid #ccd3dd;border-radius:8px;font-size:16px}textarea{min-height:75px}.full{grid-column:1/-1}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{border:1px solid #ccd3dd;padding:6px}th{background:#eef1f5}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:bold;margin:5px 4px 5px 0;cursor:pointer}.primary{background:#111827;color:#fff}.secondary{background:#e5e7eb}.danger{background:#fee2e2}.totals{max-width:330px;margin:15px 0 0 auto}.tr{display:flex;justify-content:space-between;padding:5px}.grand{font-size:19px;font-weight:bold;border-top:2px solid #111827;padding-top:8px}.actions{margin-top:14px}.msg{font-weight:bold;margin:10px 0}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}table{font-size:13px}}@media print{.no-print{display:none!important}}</style></head><body><div class="wrap"><div class="card"><div class="brand"><div class="logo">LOGO</div><div><h1 style="margin:0">COTIZACIÓN DE SERVICIO</h1><b>Mantenimiento eléctrico y mecánico de estaciones de servicio</b></div></div><div class="grid"><div><label>N.º de cotización</label><input id="numero"></div><div><label>Fecha</label><input id="fecha" type="date"></div><div><label>Cliente / Empresa</label><input id="cliente"></div><div><label>Estación de servicio</label><input id="estacion"></div><div><label>Dirección</label><input id="direccion"></div><div><label>Contacto</label><input id="contacto"></div><div class="full"><label>Descripción / alcance del trabajo</label><textarea id="descripcion"></textarea></div></div><h3>Materiales y servicios</h3><table id="items"><thead><tr><th>Cant.</th><th>Unidad</th><th>Descripción</th><th>Precio unitario</th><th>Total</th><th class="no-print"></th></tr></thead><tbody></tbody></table><button class="btn secondary no-print" onclick="addItem()">+ Agregar ítem</button><div class="totals"><div class="tr"><span>Subtotal</span><b id="subtotal">$0.00</b></div><div class="tr"><span>IVA (%)</span><input id="iva" type="number" value="15" min="0" step="0.01" oninput="calc()" style="width:90px"></div><div class="tr"><span>IVA</span><b id="ivaval">$0.00</b></div><div class="tr grand"><span>TOTAL</span><b id="total">$0.00</b></div></div><div class="grid"><div class="full"><label>Observaciones / condiciones de pago</label><textarea id="observaciones"></textarea></div></div><div class="actions no-print"><button class="btn primary" onclick="generarPDF()">📄 GENERAR Y DESCARGAR PDF</button><button class="btn secondary" onclick="nueva()">🆕 NUEVA COTIZACIÓN</button><button class="btn secondary" onclick="window.print()">🖨️ IMPRIMIR</button></div><div id="msg" class="msg"></div></div></div><script>
const $=id=>document.getElementById(id);function money(n){return '$'+Number(n||0).toFixed(2)}function fecha(){return new Date().toISOString().slice(0,10)}function numero(){let n=+localStorage.getItem('cotNum')||0;n++;localStorage.setItem('cotNum',n);return 'COT-'+String(n).padStart(4,'0')}function addItem(q=1,u='und',d='',p=0){let r=document.createElement('tr');r.innerHTML=`<td><input class="q" type="number" value="${q}" min="0" step="0.01"></td><td><input class="u" value="${u}"></td><td><input class="d" value="${d}"></td><td><input class="p" type="number" value="${p}" min="0" step="0.01"></td><td class="line">$0.00</td><td class="no-print"><button class="btn danger" onclick="this.closest('tr').remove();calc()">×</button></td>`;$('items').querySelector('tbody').appendChild(r);r.querySelectorAll('input').forEach(x=>x.oninput=calc);calc()}function calc(){let s=0;document.querySelectorAll('#items tbody tr').forEach(r=>{let v=(+r.querySelector('.q').value||0)*(+r.querySelector('.p').value||0);s+=v;r.querySelector('.line').textContent=money(v)});let iv=s*(+$('iva').value||0)/100;$('subtotal').textContent=money(s);$('ivaval').textContent=money(iv);$('total').textContent=money(s+iv);return{s,iv,total:s+iv}}function val(id){return $(id).value.trim()}async function generarPDF(){let msg=$('msg');if(!window.jspdf){msg.textContent='No se pudo cargar el generador PDF. Verifica tu conexión a internet y vuelve a intentar.';return}let c=calc(),{jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'}),x=15,y=18;doc.setFontSize(17);doc.text('COTIZACIÓN DE SERVICIO',x,y);doc.setFontSize(10);doc.text('Mantenimiento eléctrico y mecánico de estaciones de servicio',x,y+7);doc.line(x,y+10,195,y+10);y+=20;doc.setFontSize(10);doc.text('N.º: '+val('numero'),x,y);doc.text('Fecha: '+val('fecha'),115,y);y+=7;doc.text('Cliente: '+val('cliente'),x,y);doc.text('Estación: '+val('estacion'),115,y);y+=7;doc.text('Dirección: '+val('direccion'),x,y);doc.text('Contacto: '+val('contacto'),115,y);y+=12;doc.setFontSize(12);doc.text('Descripción / alcance',x,y);doc.setFontSize(9);let desc=doc.splitTextToSize(val('descripcion')||'—',180);doc.text(desc,x,y+6);y+=6+desc.length*4+6;doc.setFontSize(9);doc.setFillColor(235,238,242);doc.rect(x,y,180,7,'F');doc.text('Cant.',x+2,y+5);doc.text('Unidad',x+22,y+5);doc.text('Descripción',x+45,y+5);doc.text('P.Unit.',x+140,y+5);doc.text('Total',x+162,y+5);y+=11;document.querySelectorAll('#items tbody tr').forEach(r=>{if(y>270){doc.addPage();y=18}let q=r.querySelector('.q').value,u=r.querySelector('.u').value,d=r.querySelector('.d').value,p=r.querySelector('.p').value,t=r.querySelector('.line').textContent;doc.text(String(q),x+2,y);doc.text(String(u).slice(0,12),x+22,y);let dd=doc.splitTextToSize(String(d),88);doc.text(dd,x+45,y);doc.text(money(p),x+140,y);doc.text(t,x+162,y);y+=Math.max(6,dd.length*4)});y+=5;if(y>260){doc.addPage();y=18}doc.line(120,y,195,y);y+=7;doc.text('Subtotal: '+money(c.s),145,y);y+=6;doc.text('IVA '+val('iva')+'%: '+money(c.iv),145,y);y+=7;doc.setFontSize(12);doc.text('TOTAL: '+money(c.total),140,y);y+=12;doc.setFontSize(10);doc.text('Observaciones / condiciones',x,y);let ob=doc.splitTextToSize(val('observaciones')||'—',180);doc.text(ob,x,y+6);y+=8+ob.length*4;if(y>265){doc.addPage();y=18}doc.line(25,y+18,90,y+18);doc.text('Firma responsable',38,y+24);doc.line(110,y+18,175,y+18);doc.text('Firma cliente / administrador',116,y+24);doc.save((val('numero')||'cotizacion')+'.pdf');msg.textContent='✅ PDF generado correctamente. Revisa la carpeta/descargas de tu iPhone.'}function nueva(){['cliente','estacion','direccion','contacto','descripcion','observaciones'].forEach(id=>$(id).value='');$('numero').value=numero();$('fecha').value=fecha();$('iva').value=15;$('items').querySelector('tbody').innerHTML='';addItem();$('msg').textContent=''}window.onload=nueva;</script></body></html>
