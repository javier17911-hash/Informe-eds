<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5cff">
<link rel="manifest" href="manifest.json">
<title>Informe EDS</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
main{max-width:760px;margin:auto;padding:14px 14px 45px}.head{background:#0b5cff;color:#fff;border-radius:20px;padding:20px;margin-bottom:12px}.head h1{margin:0 0 4px;font-size:25px}.head p{margin:0;font-size:14px}
.card{background:#fff;border-radius:17px;padding:17px;margin:12px 0;box-shadow:0 2px 9px #0001}h2{font-size:17px;margin:0 0 13px}
label{display:block;font-size:14px;font-weight:650;margin:11px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid #d5dbe4;border-radius:10px;font-size:16px;background:#fff}textarea{min-height:105px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:11px;padding:13px 15px;font-size:16px;font-weight:700}.primary{background:#0b5cff;color:#fff;width:100%}.secondary{background:#e9efff;color:#0b5cff}.danger{background:#ffe8e8;color:#b42318}.success{background:#067647;color:#fff}
#status{text-align:center;font-weight:650;margin:10px;color:#475467}.photo-grid{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.photo{width:105px}.photo img{width:105px;height:88px;object-fit:cover;border-radius:9px}
.preview{display:none;background:#fff;padding:18px;border-radius:17px}.preview h1{font-size:23px}.preview h2{border-bottom:1px solid #aaa;padding-bottom:5px;margin-top:22px}.preview table{width:100%;border-collapse:collapse}.preview td,.preview th{border:1px solid #aaa;padding:7px;text-align:left}.reportphotos{display:flex;flex-wrap:wrap;gap:10px}.reportphotos img{width:30%;min-width:150px;max-height:190px;object-fit:contain;border:1px solid #aaa}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.actions button:last-child{grid-column:1/-1}.signature-box{display:none;margin-top:12px}.signature-box canvas{width:100%;height:220px;background:#fff;border:2px dashed #98a2b3;border-radius:12px;touch-action:none;display:block}.signature-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.signature-actions button:last-child{grid-column:1/-1}.signature-preview{max-width:280px;max-height:120px;border-bottom:1px solid #333;display:block;margin:8px 0}
@media(max-width:480px){.grid{grid-template-columns:1fr}.actions{grid-template-columns:1fr}.signature-actions{grid-template-columns:1fr}}
@media print{body{background:#fff}.head,.form,#status,.actions,.signature-box{display:none!important}.preview{display:block;padding:0;box-shadow:none}.reportphotos img{break-inside:avoid}}
</style>
</head>
<body>
<main>
<div class="head"><h1>INFORME EDS</h1><p>Mantenimiento eléctrico y mecánico de estaciones de servicio</p></div>
<section class="form" id="form">
<form id="f">
<div class="card"><h2>1. Datos de la estación</h2><label>Nombre de la estación</label><input id="station" required><label>Cliente / empresa</label><input id="client"><label>Dirección</label><input id="address"><label>Administrador</label><input id="manager"></div>
<div class="card"><h2>2. Servicio</h2><div class="grid"><div><label>Fecha</label><input id="date" type="date" required></div><div><label>Tipo</label><select id="type"><option>Correctivo</option><option>Preventivo</option><option>Emergencia</option><option>Inspección</option></select></div></div><div class="grid"><div><label>Hora inicio</label><input id="start" type="time"></div><div><label>Hora finalización</label><input id="end" type="time"></div></div><label>Equipo</label><select id="equipment"><option>Dispensador</option><option>Bomba sumergible</option><option>Tablero eléctrico</option><option>Generador</option><option>Compresor</option><option>Iluminación</option><option>Sistema hidráulico</option><option>Otro</option></select><label>Identificación del equipo</label><input id="equipmentId"></div>
<div class="card"><h2>3. Diagnóstico</h2><label>Motivo del servicio</label><textarea id="reason"></textarea><label>Falla / diagnóstico encontrado</label><textarea id="diagnosis"></textarea></div><div class="card"><h2>4. Trabajo realizado</h2><label>Descripción del trabajo</label><textarea id="work"></textarea><label>Pruebas realizadas</label><textarea id="tests"></textarea><label>Resultado final</label><textarea id="result"></textarea></div>
<div class="card"><h2>5. Materiales</h2><div class="grid"><input id="material" placeholder="Material"><input id="qty" placeholder="Cantidad"></div><button type="button" class="secondary" id="add">+ Agregar material</button><div id="materials"></div></div>
<div class="card"><h2>6. Fotografías</h2><input id="photos" type="file" accept="image/*" multiple><div class="photo-grid" id="photoGrid"></div></div><div class="card"><h2>7. Observaciones</h2><textarea id="observations"></textarea></div><div class="card"><h2>8. Técnico</h2><input id="technician" value="Javier Loachamín"></div>
<button class="primary" type="submit">📄 GENERAR INFORME</button></form><div id="status"></div></section>
<section class="preview" id="preview">
<div class="actions"><button class="primary" id="pdf">📄 GUARDAR PDF</button><button class="secondary" id="edit">✏️ EDITAR</button><button class="success" id="sign">✍️ FIRMAR DOCUMENTO</button><button class="secondary" id="newReport">🆕 NUEVO INFORME</button></div>
<div class="signature-box card" id="signatureBox"><h2>Firma del técnico</h2><p>Dibuja tu firma con el dedo dentro del recuadro.</p><canvas id="signatureCanvas"></canvas><div class="signature-actions"><button type="button" class="secondary" id="clearSignature">🧹 Limpiar firma</button><button type="button" class="success" id="saveSignature">✅ Guardar y usar firma</button><button type="button" class="secondary" id="cancelSignature">Cancelar</button></div></div>
<div id="report"></div>
</section>
</main>
<script>
const ids=["station","client","address","manager","date","type","start","end","equipment","equipmentId","reason","diagnosis","work","tests","result","observations","technician"];
const $=x=>document.getElementById(x);let mats=[],files=[],reportNumber="";
function esc(s){return String(s??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function save(){try{localStorage.setItem("edsForm",JSON.stringify({data:Object.fromEntries(ids.map(i=>[i,$(i).value])),mats}))}catch(e){}}
function restore(){try{let x=JSON.parse(localStorage.getItem("edsForm")||"null");if(x){ids.forEach(i=>{if(x.data?.[i]!=null)$(i).value=x.data[i]});mats=x.mats||[];renderMats()}}catch(e){}}
ids.forEach(i=>$(i).addEventListener("input",save));$("date").value=new Date().toISOString().slice(0,10);restore();
function renderMats(){$("materials").innerHTML=mats.map((x,i)=>`<p><b>${esc(x.m)}</b> — ${esc(x.q)} <button type="button" class="danger" onclick="mats.splice(${i},1);renderMats();save()">×</button></p>`).join("")}
$("add").onclick=()=>{let m=$("material").value.trim(),q=$("qty").value.trim();if(m){mats.push({m,q});$("material").value="";$("qty").value="";renderMats();save()}};
$("photos").onchange=e=>{files=[...e.target.files];$("photoGrid").innerHTML=files.map(f=>`<div class="photo"><img src="${URL.createObjectURL(f)}"></div>`).join("")};
const row=(a,b)=>`<tr><td><b>${esc(a)}</b></td><td>${esc(b)}</td></tr>`;const sec=(a,b)=>`<h2>${esc(a)}</h2><p>${esc(b).replace(/\n/g,"<br>")||"—"}</p>`;function data(){return Object.fromEntries(ids.map(i=>[i,$(i).value]))}function readFile(f){return new Promise(r=>{let x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)})}
function getSignature(){return localStorage.getItem("edsSignature")||""}
function signatureHtml(){let s=getSignature();return s?`<p><img class="signature-preview" src="${s}" alt="Firma del técnico"></p><p><b>Firma digital manuscrita del técnico</b></p>`:`<p>______________________________<br>Firma del técnico</p>`}
async function makeReport(){let d=data(),ph="";for(let f of files)ph+=`<img src="${await readFile(f)}">`;if(!reportNumber){let num=localStorage.getItem("edsNum")||"0";num=String(+num+1).padStart(4,"0");localStorage.setItem("edsNum",num);reportNumber=num}$("report").innerHTML=`<h1>INFORME TÉCNICO DE SERVICIO</h1><p><b>Mantenimiento eléctrico y mecánico de estaciones de servicio</b></p><p><b>N.º EDS-${new Date().getFullYear()}-${reportNumber}</b></p><h2>Datos de la estación</h2><table>${row("Estación",d.station)}${row("Cliente / empresa",d.client)}${row("Dirección",d.address)}${row("Administrador",d.manager)}</table><h2>Datos del servicio</h2><table>${row("Fecha",d.date)}${row("Tipo",d.type)}${row("Horario",(d.start||"")+" - "+(d.end||""))}${row("Equipo",d.equipment)}${row("Identificación",d.equipmentId)}</table>${sec("Motivo del servicio",d.reason)}${sec("Diagnóstico / falla encontrada",d.diagnosis)}${sec("Trabajo realizado",d.work)}${sec("Pruebas realizadas",d.tests)}${sec("Resultado final",d.result)}<h2>Materiales utilizados</h2><table><tr><th>Material</th><th>Cantidad</th></tr>${mats.length?mats.map(x=>`<tr><td>${esc(x.m)}</td><td>${esc(x.q)}</td></tr>`).join(""):"<tr><td colspan=2>No se registraron materiales</td></tr>"}</table>${sec("Observaciones y recomendaciones",d.observations)}<h2>Registro fotográfico</h2><div class="reportphotos">${ph||"<p>No se adjuntaron fotografías.</p>"}</div><h2>Responsable técnico</h2><p>${esc(d.technician)}</p>${signatureHtml()}<br><p>______________________________<br>Firma del administrador / cliente</p>`}
$("f").onsubmit=async e=>{e.preventDefault();save();$("status").textContent="Generando vista previa…";reportNumber="";await makeReport();$("form").style.display="none";$("preview").style.display="block";window.scrollTo(0,0);$("status").textContent=""};
$("edit").onclick=()=>{$("preview").style.display="none";$("form").style.display="block";window.scrollTo(0,0)};
$("pdf").onclick=()=>window.print();
function openSignature(){$("signatureBox").style.display="block";resizeCanvas();window.scrollTo({top:$('signatureBox').offsetTop-10,behavior:"smooth"})}
$("sign").onclick=openSignature;
$("cancelSignature").onclick=()=>{$("signatureBox").style.display="none"};
const canvas=$("signatureCanvas"),ctx=canvas.getContext("2d");let drawing=false,hasInk=false;
function resizeCanvas(){let r=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineWidth=2.5;ctx.lineCap="round";ctx.lineJoin="round"}
function point(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener("pointerdown",e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);drawing=true;hasInk=true;let p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y)});
canvas.addEventListener("pointermove",e=>{if(!drawing)return;e.preventDefault();let p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke()});canvas.addEventListener("pointerup",()=>{drawing=false});canvas.addEventListener("pointercancel",()=>{drawing=false});
$("clearSignature").onclick=()=>{resizeCanvas();ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);hasInk=false};
$("saveSignature").onclick=()=>{if(!hasInk){alert("Primero dibuja tu firma.");return}let s=canvas.toDataURL("image/png");localStorage.setItem("edsSignature",s);$("signatureBox").style.display="none";makeReport();alert("Firma guardada en el informe.")};
$("newReport").onclick=()=>{if(!confirm("¿Crear un nuevo informe? Se borrarán los datos y materiales del informe actual."))return;localStorage.removeItem("edsForm");localStorage.removeItem("edsSignature");mats=[];files=[];reportNumber="";ids.forEach(i=>$(i).value="");$("date").value=new Date().toISOString().slice(0,10);$("technician").value="Javier Loachamín";$("material").value="";$("qty").value="";$("photos").value="";$("photoGrid").innerHTML="";renderMats();$("signatureBox").style.display="none";$("preview").style.display="none";$("form").style.display="block";window.scrollTo(0,0)};
window.addEventListener("resize",()=>{if($("signatureBox").style.display!=="none")resizeCanvas()});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body></html>
