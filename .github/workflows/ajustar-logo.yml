name: Ajustar logo del informe

on:
  push:
    paths:
      - '.github/workflows/ajustar-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ajustar-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Corregir proporción y carga del logo
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # El logo original es horizontal (331x120). Se muestra en un área 120x80
          # para que conserve sus proporciones y sea claramente visible.
          s = re.sub(
              r'\.report-brand img\{[^}]*\}',
              '.report-brand img{width:120px;height:80px;object-fit:contain;display:block;flex:0 0 120px}',
              s,
              count=1
          )

          # Cache-busting para GitHub Pages/iPhone.
          s = s.replace('src="logo.jpg"', 'src="./logo.jpg?v=3"')
          s = s.replace("const LOGO_DATA='logo.jpg';", "const LOGO_DATA='./logo.jpg?v=3';")

          p.write_text(s, encoding='utf-8')
          PY

      - name: Guardar cambio en GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Corregir proporción y caché del logo'
          git push
