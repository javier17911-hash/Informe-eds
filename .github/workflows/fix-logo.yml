name: Corregir logo oficial

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write

jobs:
  fix-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Integrar logo oficial en la aplicación
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          logo = base64.b64encode(Path('logo_eds.jpg').read_bytes()).decode('ascii')
          data = 'data:image/jpeg;base64,' + logo

          # Cabecera principal: usar el logo real embebido para evitar problemas de ruta/caché.
          s = re.sub(r'<img class="logo"[^>]*>', '<img class="logo" src="' + data + '" alt="Mantenimiento Eléctrico y Mecánico de EDS">', s, count=1)

          # Logo utilizado en informes y cotizaciones.
          s = re.sub(r'const LOGO_DATA=.*', "const LOGO_DATA='" + data + "';", s, count=1)

          # Tamaño adecuado para mostrar el logo completo en teléfonos.
          s = s.replace('.logo{width:62px;height:62px;background:#fff;border-radius:12px;padding:6px}', '.logo{width:115px;height:72px;background:#fff;border-radius:12px;padding:4px;object-fit:contain}')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Guardar corrección en main
        run: |
          if git diff --quiet -- index.html; then
            echo 'Sin cambios para guardar.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Integrar logo oficial en toda la aplicación'
          git push

      - name: Solicitar nueva publicación de GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds || true
