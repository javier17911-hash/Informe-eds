name: Corregir logo oficial

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write

jobs:
  fix-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Corregir referencias del logo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<svg class="logo".*?</svg>', '<img class="logo" src="logo_eds.jpg?v=2" alt="Mantenimiento Eléctrico y Mecánico de EDS">', s, count=1, flags=re.S)
          s = re.sub(r'^const LOGO_DATA=.*$', "const LOGO_DATA='logo_eds.jpg?v=2';", s, count=1, flags=re.M)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Guardar corrección en main
        run: |
          if git diff --quiet -- index.html; then
            echo 'Sin cambios para guardar.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Corregir logo oficial y caché'
          git push

      - name: Solicitar nueva publicación de GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds || true
