<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restablecer Informe EDS</title></head><body><p style="font-family:Arial,sans-serif;padding:24px">Restableciendo Informe EDS…</p><script>(async()=>{try{const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs)await r.unregister();if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}try{localStorage.removeItem('edsReports');localStorage.removeItem('edsQuotes');}catch(e){}location.replace('./?reset=1&v='+Date.now());}catch(e){document.body.innerHTML='<p style="font-family:Arial,sans-serif;padding:24px">No se pudo limpiar automáticamente. Cierra la aplicación y vuelve a abrirla.</p>';}})();</script></body></html>
